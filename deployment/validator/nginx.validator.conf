# ArbiCore X — VALIDATOR-ONLY nginx (isolated). NOT for production.
#
# Topology:
#   Browser -> VPS 127.0.0.1:8299 -> this nginx (serves the validator FE build)
#           -> /api/* proxied to the f36d7c9 validator backend container
#              (name: arbicore-validator, internal port 8001) over a private
#              user-defined docker network. The backend is NEVER exposed publicly.
#
# The FE is built with REACT_APP_BACKEND_URL=/api (same-origin), so the browser
# only talks to :8299. Mount this file over the image's default site config:
#   -v .../deployment/validator/nginx.validator.conf:/etc/nginx/conf.d/default.conf:ro
# and put FE + backend on the same network (--network arbicore-validator-net).
#
# Do NOT copy this over the production nginx config.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA static + client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy -> isolated validator backend (private network).
    location /api/ {
        proxy_pass         http://arbicore-validator:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
