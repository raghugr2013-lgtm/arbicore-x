# SPA nginx config for the ArbiCore X operator terminal.
# Serves the CRA build; falls back to /index.html for client-side routing.
# Sits behind the reverse-proxy nginx which does TLS + security headers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip is applied at both layers — cheap on already-compressed responses,
    # meaningful on JSON API proxying if this container ever fronts /api directly.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets from CRA: aggressive caching.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is never cached (always fresh — deploys change the bundle hashes).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Simple liveness for the container healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
