gzip                on;
gzip_vary           on;
gzip_min_length     1024;
gzip_comp_level     6;
gzip_proxied        any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    application/vnd.api+json
    image/svg+xml;
