# Security headers — loaded on the TLS server block.
# Baseline: HSTS + framing + MIME-sniffing + XSS + Referrer + Permissions.
# Adjust CSP once you have a complete asset inventory (frontend hashed bundles).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options            "SAMEORIGIN"                          always;
add_header X-Content-Type-Options     "nosniff"                             always;
add_header X-XSS-Protection           "0"                                   always;
add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
# Baseline CSP (safe for SPA + JSON API). Tighten `connect-src` to only your API + WS.
add_header Content-Security-Policy    "default-src 'self'; base-uri 'self'; \
    script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; \
    img-src 'self' data: https:; font-src 'self' data:; \
    connect-src 'self' https: wss:; frame-ancestors 'self';" always;

# Hide upstream Server headers.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
