[pytest]
# ArbiCore X canonical regression suite (v2.0.0)
# Fixed 2 xdist workers (deterministic). loadscope pins each test class/module to one worker.
# See docs/CANONICAL_CERTIFICATION.md for the merged suite topology.
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
testpaths = tests
norecursedirs = tests/_pending_scanner_activation tests/fixtures __pycache__ .git
