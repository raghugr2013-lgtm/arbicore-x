# Supervisor alternative to systemd. Place in /etc/supervisor/conf.d/arbicore.conf
# then: supervisorctl reread && supervisorctl update

[program:arbicore-backend]
directory=/app/app/backend
command=/app/app/backend/venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 2
environment=PATH="/home/arbicore/.foundry/bin:/usr/local/bin:/usr/bin:/bin"
user=arbicore
autostart=true
autorestart=true
startretries=5
stopwaitsecs=15
stdout_logfile=/var/log/arbicore/backend.out.log
stderr_logfile=/var/log/arbicore/backend.err.log

[program:arbicore-frontend]
directory=/app/app/frontend
command=/usr/bin/npx serve -s build -l 3000
user=arbicore
autostart=true
autorestart=true
stdout_logfile=/var/log/arbicore/frontend.out.log
stderr_logfile=/var/log/arbicore/frontend.err.log
