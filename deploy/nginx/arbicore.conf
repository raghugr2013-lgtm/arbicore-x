# ArbiCore X — nginx reverse proxy. Place in /etc/nginx/sites-available/arbicore
# and symlink into sites-enabled. Terminates TLS; routes /api → backend, rest → frontend.

server {
    listen 80;
    server_name your-domain.tld;
    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.tld;

    # --- TLS (use certbot/Let's Encrypt; paths below are managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/your-domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    client_max_body_size 10m;

    # Backend API — everything prefixed with /api goes to :8001.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # fork-validation / heavy eth_call can be slow
    }

    # Frontend — static SPA on :3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
